name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java kur (Android derlemesi icin gerekli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Paketleri yukle
        run: npm install

      - name: Android native projesini olustur
        run: npx expo prebuild --platform android

      - name: Gradle ile APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yi Actions ciktisi olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: mesaj-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
